apiVersion: v1
kind: ConfigMap
metadata:
  name: sarak-config
data:
  AWS_REGION: {{ .Values.config.awsRegion | quote }}
  AWS_ENDPOINT_URL: {{ .Values.config.awsEndpointUrl | quote }}
  SQS_SCRAPE_QUEUE_NAME: {{ .Values.config.sqsScrapeQueueName | quote }}
  SQS_ALERT_QUEUE_NAME: {{ .Values.config.sqsAlertQueueName | quote }}
  REDIS_URL: {{ .Values.config.redisUrl | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: sarak-secrets
type: Opaque
stringData:
  DATABASE_URL: {{ .Values.secrets.databaseUrl | quote }}
  TELEGRAM_BOT_TOKEN: {{ .Values.secrets.telegramBotToken | quote }}
  AWS_ACCESS_KEY_ID: {{ .Values.secrets.awsAccessKeyId | quote }}
  AWS_SECRET_ACCESS_KEY: {{ .Values.secrets.awsSecretAccessKey | quote }}
